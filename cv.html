<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #f5f5f5;
            color-scheme: dark;
        }

        .container {
            width: min(100% - 2rem, 1200px);
            margin: 0 auto;
            padding: 2rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .name-title,
        .nav-links a {
            color: #f5f5f5;
            text-decoration: none;
        }

        .name-title {
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #bdbdbd;
        }

        .nav-links a:hover {
            color: #64b5f6;
        }

        .cv-section {
            text-align: center;
            padding: 3rem;
            margin: 2rem 0;
            background: #151515;
            border: 1px solid #2b2b2b;
            border-radius: 8px;
        }

        .cv-download-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background-color: #1976d2;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            font-size: 1.1rem;
        }

        .cv-download-button:hover {
            background-color: #1565c0;
        }

        .cv-icon {
            width: 24px;
            height: 24px;
        }

        .cv-description {
            margin-top: 1rem;
            color: #bdbdbd;
            font-family: Georgia, 'Times New Roman', serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="#" class="name-title">Maaz Amjad</a>
            <div class="nav-links">
                <a href="#projects">Projects</a>
                <a href="#cv">CV</a>
            </div>
        </nav>

        <!-- Other sections remain the same -->

        <section id="cv" class="cv-section">
            <a href="files/Resume.pdf" class="cv-download-button" target="_blank">
                <svg class="cv-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v13m0 0l-3-3m3 3l3-3M3 17v3a2 2 0 002 2h14a2 2 0 002-2v-3"/>
                </svg>
                Download CV
            </a>
            <p class="cv-description">Last updated: November 2024</p>
        </section>
    </div>
</body>
</html>
